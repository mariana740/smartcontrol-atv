 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Cadastral</title>
    <!-- Vincula o arquivo CSS externo -->
    <link rel="stylesheet" href="assets/css/cadastro.css">
</head>
<body>



    <main>
        <!-- Ícone de perfil de usuário centralizado acima do título -->
        <svg class="user-avatar" viewBox="0 0 24 24" fill="#1a2a5e">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>

        <p>Criar Conta</p>

        <form>
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome">

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seuemail@exemplo.com">

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="••••••••">

            <label for="genero">Gênero</label>
            <select id="genero">
                <option value="" disabled selected>Selecione uma opção</option>
                <option value="m">Masculino</option>
                <option value="f">Feminino</option>
                <option value="o">Outro</option>
            </select>

            <p>
                <input type="checkbox" id="termos">
                <label for="termos">Concordo com os termos de uso</label>
            </p>

            <button type="submit">Cadastrar</button>
        </form>
    </main>

</body>
</html>
